<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10130f"/>
      <stop offset="0.55" stop-color="#1a221c"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="1200" height="900" fill="url(#sky)"/>
    <circle cx="300" cy="220" r="130" fill="#34e3c4" fill-opacity="0.08"/>
    <path d="M0 480 L300 330 L520 440 L780 300 L1000 430 L1200 360 L1200 900 L0 900 Z" fill="#161e18"/>
    <path d="M0 620 L260 520 L540 600 L820 500 L1080 590 L1200 540 L1200 900 L0 900 Z" fill="#101511"/>
    <path d="M0 760 L320 680 L640 740 L940 660 L1200 720 L1200 900 L0 900 Z" fill="#0a0c0a"/>
    <g stroke="#34e3c4" stroke-opacity="0.12" stroke-width="2" fill="none">
      <path d="M120 700 Q360 640 600 690 T1080 660"/>
      <path d="M60 790 Q420 730 760 780 T1180 750"/>
    </g>
  </g>
</svg>
