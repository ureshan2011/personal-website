<svg width="420" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="420" height="320" fill="#f4f3f1"/>

  <!-- Subtle grid -->
  <line x1="0" y1="64" x2="420" y2="64" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="128" x2="420" y2="128" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="192" x2="420" y2="192" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="256" x2="420" y2="256" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="84" y1="0" x2="84" y2="320" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="168" y1="0" x2="168" y2="320" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="252" y1="0" x2="252" y2="320" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>
  <line x1="336" y1="0" x2="336" y2="320" stroke="#c4c6cc" stroke-width="0.5" opacity="0.6"/>

  <!-- Shared AR space (central zone) -->
  <ellipse cx="210" cy="155" rx="90" ry="75" fill="#051625" opacity="0.04" stroke="#051625" stroke-width="0.8" stroke-dasharray="6 4"/>

  <!-- User A (left) -->
  <!-- Phone device -->
  <rect x="32" y="95" width="76" height="126" rx="8" fill="white" stroke="#c4c6cc" stroke-width="1.5"/>
  <rect x="32" y="95" width="76" height="10" rx="8" fill="#051625"/>
  <rect x="38" y="95" width="64" height="6" rx="0" fill="#051625"/>
  <circle cx="70" cy="100" r="2" fill="#b8c8dc" opacity="0.7"/>
  <!-- Screen content -->
  <rect x="40" y="113" width="60" height="80" rx="2" fill="#efeeeb"/>
  <circle cx="60" cy="133" r="6" fill="#051625" opacity="0.5"/>
  <circle cx="80" cy="145" r="5" fill="#775a19" opacity="0.5"/>
  <line x1="60" y1="133" x2="80" y2="145" stroke="#775a19" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="40" y1="205" x2="96" y2="205" stroke="#c4c6cc" stroke-width="1" stroke-linecap="round"/>
  <circle cx="70" cy="214" r="3" fill="#e3e2e0"/>

  <!-- User A figure above phone -->
  <circle cx="70" cy="68" r="16" fill="#051625" opacity="0.12" stroke="#051625" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="70" cy="66" r="8" fill="#051625" opacity="0.55"/>
  <path d="M56 80 Q70 88 84 80" stroke="#051625" stroke-width="1.5" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- User B (right) -->
  <rect x="312" y="95" width="76" height="126" rx="8" fill="white" stroke="#c4c6cc" stroke-width="1.5"/>
  <rect x="312" y="95" width="76" height="10" rx="8" fill="#775a19" opacity="0.8"/>
  <rect x="318" y="95" width="64" height="6" rx="0" fill="#775a19" opacity="0.8"/>
  <circle cx="350" cy="100" r="2" fill="#ffdea5" opacity="0.7"/>
  <rect x="320" y="113" width="60" height="80" rx="2" fill="#efeeeb"/>
  <circle cx="340" cy="145" r="5" fill="#775a19" opacity="0.5"/>
  <circle cx="360" cy="133" r="6" fill="#051625" opacity="0.5"/>
  <line x1="340" y1="145" x2="360" y2="133" stroke="#051625" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="320" y1="205" x2="376" y2="205" stroke="#c4c6cc" stroke-width="1" stroke-linecap="round"/>
  <circle cx="350" cy="214" r="3" fill="#e3e2e0"/>

  <circle cx="350" cy="68" r="16" fill="#775a19" opacity="0.1" stroke="#775a19" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="350" cy="66" r="8" fill="#775a19" opacity="0.55"/>
  <path d="M336 80 Q350 88 364 80" stroke="#775a19" stroke-width="1.5" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- Exchange arrows in the shared space -->
  <!-- Arrow right (item sent A→B) -->
  <path d="M120 148 L200 140" stroke="#051625" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-dark)" opacity="0.5"/>
  <!-- Arrow left (confirmation B→A) -->
  <path d="M300 168 L220 175" stroke="#775a19" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-gold)" opacity="0.5"/>

  <!-- Virtual item in centre -->
  <rect x="186" y="130" width="48" height="48" rx="4" fill="white" stroke="#051625" stroke-width="1" opacity="0.9"/>
  <!-- Item icon: cube/3D object -->
  <polygon points="210,140 224,148 210,156 196,148" fill="#051625" opacity="0.15"/>
  <polygon points="210,156 196,148 196,164 210,172" fill="#051625" opacity="0.1"/>
  <polygon points="210,156 224,148 224,164 210,172" fill="#051625" opacity="0.08"/>
  <polyline points="196,148 210,140 224,148 224,164 210,172 196,164 196,148" stroke="#051625" stroke-width="1.2" fill="none" opacity="0.5" stroke-linejoin="round"/>
  <line x1="210" y1="140" x2="210" y2="156" stroke="#051625" stroke-width="0.8" opacity="0.4"/>
  <line x1="196" y1="148" x2="224" y2="148" stroke="#051625" stroke-width="0.8" opacity="0.3"/>
  <!-- Lock icon below item -->
  <rect x="202" y="160" width="16" height="12" rx="2" fill="#775a19" opacity="0.7"/>
  <path d="M205 160 L205 157 Q210 152 215 157 L215 160" stroke="#775a19" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="210" cy="165" r="2" fill="white" opacity="0.9"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#051625" opacity="0.5"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#775a19" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Bottom labels -->
  <rect x="34" y="232" width="72" height="18" rx="2" fill="white" opacity="0.7"/>
  <text x="70" y="245" font-family="Inter, sans-serif" font-size="9" fill="#43474c" text-anchor="middle" letter-spacing="0.06em">USER A</text>
  <rect x="314" y="232" width="72" height="18" rx="2" fill="white" opacity="0.7"/>
  <text x="350" y="245" font-family="Inter, sans-serif" font-size="9" fill="#43474c" text-anchor="middle" letter-spacing="0.06em">USER B</text>
  <rect x="162" y="184" width="96" height="18" rx="2" fill="white" opacity="0.7"/>
  <text x="210" y="197" font-family="Inter, sans-serif" font-size="9" fill="#775a19" text-anchor="middle" letter-spacing="0.05em" font-weight="600">SHARED AR SPACE</text>

  <!-- Bottom bar -->
  <rect x="0" y="290" width="420" height="30" fill="#051625" opacity="0.05"/>
  <text x="210" y="309" font-family="Inter, sans-serif" font-size="9" fill="#43474c" text-anchor="middle" letter-spacing="0.07em">TRUST &amp; SOCIAL INTERACTION · SHARED AUGMENTED REALITY</text>
</svg>
