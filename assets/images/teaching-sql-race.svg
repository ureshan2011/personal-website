<svg width="560" height="340" viewBox="0 0 560 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="560" height="340" fill="#efeeeb"/>

  <!-- Subtle grid -->
  <line x1="0" y1="68" x2="560" y2="68" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="136" x2="560" y2="136" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="204" x2="560" y2="204" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="272" x2="560" y2="272" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="112" y1="0" x2="112" y2="340" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="224" y1="0" x2="224" y2="340" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="336" y1="0" x2="336" y2="340" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>
  <line x1="448" y1="0" x2="448" y2="340" stroke="#c4c6cc" stroke-width="0.5" opacity="0.5"/>

  <!-- Race track outer boundary -->
  <ellipse cx="280" cy="170" rx="220" ry="120" fill="none" stroke="#051625" stroke-width="2" opacity="0.15"/>
  <!-- Track fill / asphalt -->
  <ellipse cx="280" cy="170" rx="220" ry="120" fill="#051625" opacity="0.04"/>
  <!-- Race track inner boundary -->
  <ellipse cx="280" cy="170" rx="140" ry="64" fill="#efeeeb" stroke="#051625" stroke-width="1.5" opacity="0.2"/>
  <!-- Track road surface (between outer and inner) -->
  <ellipse cx="280" cy="170" rx="220" ry="120" fill="none" stroke="#051625" stroke-width="36" opacity="0.05"/>

  <!-- Center track zone label -->
  <text x="280" y="162" font-family="Inter, sans-serif" font-size="13" fill="#051625" text-anchor="middle" font-weight="700" opacity="0.4" letter-spacing="0.1em">SQL</text>
  <text x="280" y="180" font-family="Inter, sans-serif" font-size="13" fill="#051625" text-anchor="middle" font-weight="700" opacity="0.4" letter-spacing="0.1em">RACE</text>

  <!-- START / FINISH line -->
  <line x1="280" y1="50" x2="280" y2="106" stroke="#051625" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Checkered flag pattern at finish -->
  <rect x="274" y="44" width="12" height="8" fill="#051625"/>
  <rect x="280" y="44" width="6" height="4" fill="white"/>
  <rect x="274" y="48" width="6" height="4" fill="white"/>

  <!-- Checkpoint markers on track -->
  <!-- Checkpoint 1: SELECT - top-left area -->
  <circle cx="132" cy="108" r="18" fill="white" stroke="#051625" stroke-width="1.5" opacity="0.9"/>
  <text x="132" y="104" font-family="Inter, sans-serif" font-size="7" fill="#051625" text-anchor="middle" font-weight="600" letter-spacing="0.04em">SELECT</text>
  <text x="132" y="115" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">*</text>
  <circle cx="132" cy="108" r="18" fill="none" stroke="#051625" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Checkpoint 2: WHERE - left side -->
  <circle cx="62" cy="170" r="18" fill="white" stroke="#775a19" stroke-width="1.5" opacity="0.9"/>
  <text x="62" y="167" font-family="Inter, sans-serif" font-size="7" fill="#775a19" text-anchor="middle" font-weight="600" letter-spacing="0.04em">WHERE</text>
  <text x="62" y="178" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">filter</text>
  <circle cx="62" cy="170" r="18" fill="none" stroke="#775a19" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Checkpoint 3: JOIN - bottom-left -->
  <circle cx="132" cy="232" r="18" fill="white" stroke="#051625" stroke-width="1.5" opacity="0.9"/>
  <text x="132" y="229" font-family="Inter, sans-serif" font-size="7" fill="#051625" text-anchor="middle" font-weight="600" letter-spacing="0.04em">JOIN</text>
  <text x="132" y="240" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">merge</text>
  <circle cx="132" cy="232" r="18" fill="none" stroke="#051625" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Checkpoint 4: GROUP BY - bottom-right -->
  <circle cx="428" cy="232" r="18" fill="white" stroke="#051625" stroke-width="1.5" opacity="0.9"/>
  <text x="428" y="229" font-family="Inter, sans-serif" font-size="7" fill="#051625" text-anchor="middle" font-weight="600" letter-spacing="0.04em">GROUP</text>
  <text x="428" y="240" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">BY</text>
  <circle cx="428" cy="232" r="18" fill="none" stroke="#051625" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Checkpoint 5: ORDER BY - right side -->
  <circle cx="498" cy="170" r="18" fill="white" stroke="#775a19" stroke-width="1.5" opacity="0.9"/>
  <text x="498" y="167" font-family="Inter, sans-serif" font-size="7" fill="#775a19" text-anchor="middle" font-weight="600" letter-spacing="0.04em">ORDER</text>
  <text x="498" y="178" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">BY</text>
  <circle cx="498" cy="170" r="18" fill="none" stroke="#775a19" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Checkpoint 6: HAVING - top-right -->
  <circle cx="428" cy="108" r="18" fill="white" stroke="#051625" stroke-width="1.5" opacity="0.9"/>
  <text x="428" y="105" font-family="Inter, sans-serif" font-size="7" fill="#051625" text-anchor="middle" font-weight="600" letter-spacing="0.04em">HAVING</text>
  <text x="428" y="116" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">clause</text>
  <circle cx="428" cy="108" r="18" fill="none" stroke="#051625" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Racer 1 (leading) - navy racer at WHERE position -->
  <g transform="translate(56,148)">
    <rect x="-10" y="-8" width="20" height="12" rx="2" fill="#051625"/>
    <rect x="-7" y="-11" width="14" height="6" rx="1" fill="#051625" opacity="0.7"/>
    <circle cx="-6" cy="4" r="3" fill="#1a1c1a"/>
    <circle cx="6" cy="4" r="3" fill="#1a1c1a"/>
    <text x="0" y="-1" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="700">1</text>
  </g>

  <!-- Racer 2 - gold racer slightly behind at SELECT position -->
  <g transform="translate(148,96)">
    <rect x="-10" y="-8" width="20" height="12" rx="2" fill="#775a19"/>
    <rect x="-7" y="-11" width="14" height="6" rx="1" fill="#775a19" opacity="0.7"/>
    <circle cx="-6" cy="4" r="3" fill="#1a1c1a"/>
    <circle cx="6" cy="4" r="3" fill="#1a1c1a"/>
    <text x="0" y="-1" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="700">2</text>
  </g>

  <!-- Racer 3 - faded racer near top -->
  <g transform="translate(310,54)">
    <rect x="-10" y="-8" width="20" height="12" rx="2" fill="#051625" opacity="0.4"/>
    <rect x="-7" y="-11" width="14" height="6" rx="1" fill="#051625" opacity="0.3"/>
    <circle cx="-6" cy="4" r="3" fill="#1a1c1a" opacity="0.4"/>
    <circle cx="6" cy="4" r="3" fill="#1a1c1a" opacity="0.4"/>
    <text x="0" y="-1" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="700" opacity="0.6">3</text>
  </g>

  <!-- Speed trail lines for racer 1 -->
  <line x1="30" y1="145" x2="44" y2="145" stroke="#051625" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <line x1="28" y1="149" x2="44" y2="149" stroke="#051625" stroke-width="0.7" opacity="0.2" stroke-linecap="round"/>

  <!-- Speed trail for racer 2 -->
  <line x1="122" y1="93" x2="136" y2="93" stroke="#775a19" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <line x1="120" y1="97" x2="136" y2="97" stroke="#775a19" stroke-width="0.7" opacity="0.2" stroke-linecap="round"/>

  <!-- Leaderboard panel (top right) -->
  <rect x="440" y="16" width="106" height="78" rx="2" fill="white" stroke="#e3e2e0" stroke-width="1"/>
  <text x="456" y="32" font-family="Inter, sans-serif" font-size="8" fill="#051625" font-weight="600" letter-spacing="0.06em">LEADERBOARD</text>
  <line x1="448" y1="37" x2="538" y2="37" stroke="#e3e2e0" stroke-width="0.5"/>
  <text x="452" y="50" font-family="Inter, sans-serif" font-size="7" fill="#051625">🥇</text>
  <text x="466" y="50" font-family="Inter, sans-serif" font-size="7" fill="#051625" font-weight="600">Student A</text>
  <text x="536" y="50" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="end">94pts</text>
  <text x="452" y="62" font-family="Inter, sans-serif" font-size="7" fill="#775a19">🥈</text>
  <text x="466" y="62" font-family="Inter, sans-serif" font-size="7" fill="#43474c">Student B</text>
  <text x="536" y="62" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="end">87pts</text>
  <text x="452" y="74" font-family="Inter, sans-serif" font-size="7" fill="#43474c">🥉</text>
  <text x="466" y="74" font-family="Inter, sans-serif" font-size="7" fill="#43474c">Student C</text>
  <text x="536" y="74" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="end">81pts</text>
  <text x="452" y="86" font-family="Inter, sans-serif" font-size="7" fill="#43474c" opacity="0.6">· · · 228 players · · ·</text>

  <!-- Query challenge box (bottom left) -->
  <rect x="14" y="278" width="200" height="50" rx="2" fill="#051625"/>
  <text x="24" y="296" font-family="Inter, sans-serif" font-size="8" fill="#b8c8dc" font-weight="600" letter-spacing="0.06em">CURRENT CHALLENGE</text>
  <text x="24" y="310" font-family="Inter, monospace, sans-serif" font-size="7" fill="#8292a5">SELECT dept, AVG(salary)</text>
  <text x="24" y="320" font-family="Inter, monospace, sans-serif" font-size="7" fill="#8292a5">FROM employees GROUP BY dept</text>

  <!-- Timer badge -->
  <rect x="346" y="278" width="80" height="28" rx="2" fill="white" stroke="#775a19" stroke-width="1"/>
  <text x="386" y="291" font-family="Inter, sans-serif" font-size="8" fill="#775a19" text-anchor="middle" font-weight="600" letter-spacing="0.04em">⏱ 00:47</text>
  <text x="386" y="301" font-family="Inter, sans-serif" font-size="7" fill="#43474c" text-anchor="middle">TIME REMAINING</text>

  <!-- Bottom label bar -->
  <rect x="0" y="310" width="560" height="30" fill="#051625" opacity="0.06"/>
  <text x="280" y="329" font-family="Inter, sans-serif" font-size="9" fill="#43474c" text-anchor="middle" letter-spacing="0.08em">SQL RACE · COMPETITIVE DATABASE LEARNING · MBI802 COURSE FEATURE</text>
</svg>
